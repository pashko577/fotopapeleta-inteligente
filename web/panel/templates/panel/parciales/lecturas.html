<ul class="mt-3">
  {% for c in lecturas %}
    <li class="flex items-center gap-3 border-b border-border py-2.5 last:border-0">
      <span class="font-mono text-xs text-text-muted">{{ c.timestamp|hora }}</span>
      <span class="font-mono text-xs font-semibold">{{ c.camara_id }}</span>
      <span class="flex-1">{% placa_sm c.placa %}</span>
      <span class="font-mono text-xs {% if c.placa_confianza >= 0.8 %}text-success{% elif c.placa_confianza >= 0.5 %}text-text-secondary{% else %}text-warning{% endif %}">{{ c.placa_confianza|pct }}</span>
    </li>
  {% empty %}
    <li class="py-8 text-center text-text-secondary">Sin lecturas todavía.</li>
  {% endfor %}
</ul>
