<li class="card flex flex-col gap-4 p-5 md:flex-row md:items-center md:gap-6 md:p-6">
  <span class="flex size-14 flex-none items-center justify-center rounded-full {% if destacado %}bg-primary text-white{% else %}bg-primary-subtle text-primary-text{% endif %}">{% lucide icono size=24 %}</span>
  <div class="flex-1">
    <h2 class="text-xl font-semibold">{{ n }}. {{ titulo }}</h2>
    <p class="mt-1.5 text-text-secondary">{{ texto }}</p>
  </div>
  <div class="rounded-lg bg-surface-muted px-4 py-3 md:w-64">
    <p class="rotulo text-text-muted">Ejemplo</p>
    <p class="mt-1 font-mono text-[13px] font-semibold">{{ ej1 }}</p>
    <p class="font-mono text-xs text-text-secondary">{{ ej2 }}</p>
  </div>
</li>
