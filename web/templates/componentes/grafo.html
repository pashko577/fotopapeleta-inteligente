{# GraphCanvas. Parámetros: g (panel.grafo_svg.lienzo), compacto, nombres, enlace (prefijo de URL del nodo) #}
{% with r=compacto|yesno:"9,18" %}
<svg viewBox="0 0 {{ g.ancho }} {{ g.alto }}" class="block h-auto w-full select-none" role="img" aria-label="{{ aria|default:'Red de cámaras' }}">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" class="fill-graph-edge"></path>
    </marker>
  </defs>
  {% for a in g.aristas %}
    <line x1="{{ a.x1|stringformat:'.1f' }}" y1="{{ a.y1|stringformat:'.1f' }}" x2="{{ a.x2|stringformat:'.1f' }}" y2="{{ a.y2|stringformat:'.1f' }}"
          class="{% if a.ruta %}stroke-graph-route{% else %}stroke-graph-edge{% endif %}" stroke-width="{% if a.ruta %}{{ compacto|yesno:'4,6' }}{% else %}2{% endif %}" stroke-linecap="round"></line>
  {% endfor %}
  {% for a in g.aristas %}{% if a.texto %}
    <g transform="translate({{ a.mx|stringformat:'.1f' }} {{ a.my|stringformat:'.1f' }})">
      <rect x="-{% widthratio a.ancho_texto 2 1 %}" y="-10" width="{{ a.ancho_texto|stringformat:'.0f' }}" height="20" rx="4"
            class="fill-surface {% if a.ruta %}stroke-graph-route{% else %}stroke-border{% endif %}" stroke-width="1"></rect>
      <text text-anchor="middle" dy="4" class="fill-text-secondary font-mono" font-size="11">{{ a.texto }}</text>
    </g>
  {% endif %}{% endfor %}
  {% for n in g.nodos %}
    {% if enlace %}<a href="{{ enlace }}{{ n.codigo }}" aria-label="{{ n.codigo }} · {{ n.nombre }}">{% endif %}
    <g transform="translate({{ n.x|stringformat:'.1f' }} {{ n.y|stringformat:'.1f' }})">
      {% if n.seleccionado %}<circle r="{{ r|add:10 }}" class="fill-primary/20"></circle>{% endif %}
      <circle r="{{ r }}" stroke-width="{% if n.estado %}3{% else %}2{% endif %}"
        class="{% if n.rol == 'origen' %}fill-graph-origin stroke-graph-origin{% elif n.rol == 'destino' %}fill-graph-target stroke-graph-target{% elif n.rol == 'visitado' %}fill-graph-visited stroke-graph-node-border{% elif n.estado == 'offline' %}fill-graph-node stroke-camera-offline{% elif n.estado == 'online' %}fill-graph-node stroke-camera-online{% else %}fill-graph-node stroke-graph-node-border{% endif %}"></circle>
      {% if not compacto %}
      <g transform="translate(-9 -9)" class="{% if n.rol == 'origen' or n.rol == 'destino' %}text-white{% elif n.estado == 'offline' %}text-camera-offline{% else %}text-text-secondary{% endif %}">
        {% if n.estado == 'offline' %}{% lucide "wifi-off" size=18 %}{% else %}{% lucide "cctv" size=18 %}{% endif %}
      </g>
      {% endif %}
      {% if n.orden %}
      <g transform="translate({{ r|add:-4 }} -{{ r|add:2 }})">
        <circle r="9" class="fill-text"></circle>
        <text text-anchor="middle" dy="4" font-size="11" font-weight="700" class="fill-surface font-mono">{{ n.orden }}</text>
      </g>
      {% endif %}
      <text text-anchor="middle" y="{{ r|add:16 }}" font-size="{{ compacto|yesno:'11,13' }}" font-weight="700" class="fill-text font-mono">{{ n.codigo }}</text>
      {% if nombres %}<text text-anchor="middle" y="{{ r|add:31 }}" font-size="12" class="fill-text-secondary">{{ n.nombre }}</text>{% endif %}
    </g>
    {% if enlace %}</a>{% endif %}
  {% endfor %}
</svg>
{% endwith %}
