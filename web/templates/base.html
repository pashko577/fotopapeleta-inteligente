{% load static %}<!doctype html>
<html lang="es" data-theme="light" data-density="comfortable">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block titulo %}FotoPapeleta Inteligente{% endblock %}</title>
  <script>
    /* Tema y densidad antes de pintar, para evitar el parpadeo */
    (function () {
      var leer = function (k, d) { try { var v = localStorage.getItem("fp-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
      var t = leer("tema", "sistema");
      var oscuro = t === "oscuro" || (t === "sistema" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = oscuro ? "dark" : "light";
      document.documentElement.dataset.density = leer("densidad", "comoda") === "compacta" ? "compact" : "comfortable";
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4ED8'/%3E%3Cpath d='M9 12V10a1 1 0 0 1 1-1h2M20 9h2a1 1 0 0 1 1 1v2M23 20v2a1 1 0 0 1-1 1h-2M12 23h-2a1 1 0 0 1-1-1v-2M11 16h10' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/app.js' %}"></script>
  <script defer src="{% static 'vendor/htmx.min.js' %}"></script>
  <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}min-h-dvh{% endblock %}">
  {% block cuerpo %}{% endblock %}

  {% for m in messages %}<span hidden data-mensaje="{{ m.message }}" data-tipo="{{ m.tags|default:'info' }}" data-detalle="{{ m.extra_tags|default:'' }}"></span>{% endfor %}
  {% include "componentes/toasts.html" %}
</body>
</html>
